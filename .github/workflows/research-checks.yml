name: Research checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-workflow:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install research dependencies
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip check
      - name: Run tests without the private cohort
        run: python -m pytest -q
      - name: Run the synthetic research example
        run: python -m digihealth_risk.publication.smoke
      - name: Check both reproduction profiles
        run: |
          bash -n reproduce.sh
          bash reproduce.sh --profile healthcom --dry-run
          bash reproduce.sh --profile thesis --dry-run
